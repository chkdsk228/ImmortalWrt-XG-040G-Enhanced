# 定期同步上游配置仓库 (bingoguo93/OpenWRT-CI-XG-040G-MD) 的更新
# 白名单策略: 只同步需要的文件, 自研文件(PRIVATE.txt/AirohaCustom.sh)与无关平台配置永不触碰

name: Sync Upstream

on:
  schedule:
    - cron: '0 19 */3 * *'   # 每 3 天 UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Fetch upstream config
        run: |
          rm -rf /tmp/upstream-config
          git clone --depth=1 https://github.com/bingoguo93/OpenWRT-CI-XG-040G-MD.git /tmp/upstream-config
          echo "upstream cloned"

      - name: Sync Scripts whitelist
        run: |
          CHANGED=0
          echo "=== Sync Scripts/ (whitelist: Settings.sh Packages.sh Handles.sh) ==="
          for name in Settings.sh Packages.sh Handles.sh; do
            f="/tmp/upstream-config/Scripts/$name"
            if [ -f "$f" ]; then
              if [ -f "./Scripts/$name" ]; then
                if ! diff -q "$f" "./Scripts/$name" >/dev/null 2>&1; then
                  cp -f "$f" "./Scripts/$name"
                  echo "  updated Scripts/$name"
                  CHANGED=1
                fi
              else
                cp -f "$f" "./Scripts/$name"
                echo "  added Scripts/$name"
                CHANGED=1
              fi
            fi
          done
          echo "CHANGED=$CHANGED" >> "$GITHUB_ENV"

      - name: Sync Config whitelist
        run: |
          CHANGED_CFG=0
          echo "=== Sync Config/ (whitelist: GENERAL.txt only) ==="
          f="/tmp/upstream-config/Config/GENERAL.txt"
          if [ -f "$f" ]; then
            if [ -f "./Config/GENERAL.txt" ]; then
              if ! diff -q "$f" "./Config/GENERAL.txt" >/dev/null 2>&1; then
                cp -f "$f" "./Config/GENERAL.txt"
                echo "  updated Config/GENERAL.txt"
                CHANGED_CFG=1
              fi
            else
              cp -f "$f" "./Config/GENERAL.txt"
              echo "  added Config/GENERAL.txt"
              CHANGED_CFG=1
            fi
          fi
          echo "CHANGED_CFG=$CHANGED_CFG" >> "$GITHUB_ENV"

      - name: Commit and push
        if: env.CHANGED == '1' || env.CHANGED_CFG == '1'
        run: |
          git add -A
          git commit -m "sync: 同步上游 bingoguo93/OpenWRT-CI-XG-040G-MD (白名单: Scripts + GENERAL.txt)"
          git push origin main
          echo "committed and pushed"

      - name: Trigger rebuild
        if: env.CHANGED == '1' || env.CHANGED_CFG == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run AIR-ENHANCED.yml --repo ${{ github.repository }}
          echo "triggered AIR-ENHANCED rebuild"

      - name: Show result
        if: always()
        run: git log --oneline -3 || true